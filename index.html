<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kahoot! 中秋太陰御神籤・線上抽籤所</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas: 支援匯出高解析度長條籤紙圖片 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Google Fonts: 正統日式明朝體、宋體與古典襯線字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Noto+Serif+TC:wght@600;700;900&family=Zen+Old+Mincho:wght@600;900&display=swap" rel="stylesheet">

  <style>
    body {
      background: radial-gradient(circle at 50% 15%, #181d31 0%, #0c0e17 100%);
      font-family: 'Noto Serif TC', 'Noto Serif JP', 'Zen Old Mincho', serif;
    }

    /* 正統日本和紙/宣紙纖維底色 */
    .washi-paper {
      background-color: #fcfbfa;
      background-image: 
        radial-gradient(rgba(190, 180, 160, 0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.75), rgba(246, 243, 235, 0.95));
      background-size: 8px 8px, 100% 100%;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(185, 28, 28, 0.15);
    }

    /* 直排文字書寫模式 (全直排排版) */
    .vertical-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 0.22em;
    }

    /* 籤筒搖晃動畫 */
    @keyframes shake {
      0% { transform: rotate(0deg) translateY(0); }
      20% { transform: rotate(-8deg) translateY(-6px); }
      40% { transform: rotate(8deg) translateY(4px); }
      60% { transform: rotate(-6deg) translateY(-4px); }
      80% { transform: rotate(6deg) translateY(2px); }
      100% { transform: rotate(0deg) translateY(0); }
    }
    .animate-shake {
      animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both;
    }
  </style>
</head>
<body class="min-h-screen text-slate-200 flex flex-col items-center justify-start py-8 px-4">

  <!-- 頂部活動前導說明 -->
  <header class="text-center max-w-sm w-full mb-6">
    <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-red-950/40 border border-red-500/30 rounded-full text-red-300 text-xs font-medium mb-3">
      <span>🌕 丙午年中秋太陰神諭所</span>
    </div>
    <h1 class="text-2xl font-bold tracking-wide text-amber-100">
      Kahoot! 挑戰完賽抽籤所
    </h1>
    <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">
      答題完畢！搖動神籤筒求取中秋專屬運勢籤紙<br>
      長按存圖貼回 FB 留言，領取「詳細解籤 ＋ 冷知識題組包」！
    </p>
  </header>

  <!-- 籤筒搖籤互動區 -->
  <section id="drawBox" class="w-full max-w-xs flex flex-col items-center bg-slate-900/80 backdrop-blur border border-slate-700/80 rounded-2xl p-6 shadow-xl mb-6">
    <!-- 籤筒本體 SVG -->
    <div id="cylinder" class="cursor-pointer transition-transform hover:scale-105 active:scale-95 duration-200">
      <svg width="120" height="150" viewBox="0 0 120 150" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M25 40 L30 140 C30 145 90 145 90 140 L95 40 Z" fill="#b45309" stroke="#78350f" stroke-width="3"/>
        <path d="M25 40 C25 35 95 35 95 40 C95 45 25 45 25 40 Z" fill="#d97706" stroke="#78350f" stroke-width="2"/>
        <line x1="60" y1="12" x2="60" y2="40" stroke="#fde68a" stroke-width="5" stroke-linecap="round"/>
        <line x1="48" y1="20" x2="52" y2="40" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>
        <line x1="72" y1="18" x2="68" y2="40" stroke="#fef3c7" stroke-width="4" stroke-linecap="round"/>
        <rect x="29" y="80" width="62" height="18" fill="#b91c1c"/>
        <text x="60" y="93" fill="#fff" font-size="10" text-anchor="middle" font-weight="bold" font-family="'Noto Serif TC', serif">太陰神籤</text>
      </svg>
    </div>

    <button 
      id="drawBtn"
      class="mt-6 w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-red-900/30 transition duration-150 flex items-center justify-center gap-2 text-sm tracking-wider"
    >
      <span>🎋 搖一搖・求取神籤</span>
    </button>
  </section>

  <!-- ⛩️ 神社御神籤紙條 (Omikuji 固定版型) -->
  <main id="omikujiWrapper" class="w-full flex flex-col items-center hidden">
    
    <!-- 籤紙容器 (修長長方形 800*1200 等比視覺) -->
    <div 
      id="omikujiPaper" 
      class="w-[330px] washi-paper border-2 border-[#b91c1c]/30 text-[#b91c1c] p-4 relative overflow-hidden flex flex-col items-center select-none"
    >
      <!-- 頂部人字破風屋簷與十六瓣菊花徽記 (Kikumon) -->
      <div class="w-full flex flex-col items-center">
        <svg class="w-full h-11" viewBox="0 0 320 50" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 5 25 L 160 5 L 315 25" stroke="#b91c1c" stroke-width="2.5" fill="none"/>
          <path d="M 12 30 L 160 12 L 308 30" stroke="#b91c1c" stroke-width="1.2" fill="none"/>
          <g transform="translate(160, 20)">
            <circle cx="0" cy="0" r="4.5" fill="#b91c1c"/>
            <path d="M-2 -12 C-3 -7 -1 -5 0 0 C1 -5 3 -7 2 -12 Z" fill="#b91c1c"/>
            <path d="M-2 12 C-3 7 -1 5 0 0 C1 5 3 7 2 12 Z" fill="#b91c1c"/>
            <path d="M-12 -2 C-7 -3 -5 -1 0 0 C-5 1 -7 3 -12 2 Z" fill="#b91c1c"/>
            <path d="M12 -2 C7 -3 5 -1 0 0 C5 1 7 3 12 2 Z" fill="#b91c1c"/>
            <path d="M-8 -8 C-6 -4 -4 -3 0 0 C-3 -4 -4 -6 -8 -8 Z" fill="#b91c1c"/>
            <path d="M8 8 C6 4 4 3 0 0 C3 4 4 6 8 8 Z" fill="#b91c1c"/>
            <path d="M-8 8 C-6 4 -4 3 0 0 C-3 4 -4 6 -8 8 Z" fill="#b91c1c"/>
            <path d="M8 -8 C6 -4 4 -3 0 0 C3 -4 4 -6 8 -8 Z" fill="#b91c1c"/>
          </g>
        </svg>

        <!-- 頂部雙平行橫實線 -->
        <div class="w-full border-t-2 border-[#b91c1c] mt-0.5"></div>
        <div class="w-full border-t border-[#b91c1c] mt-1"></div>
      </div>

      <!-- 籤號與神諭尊號 -->
      <div class="text-center mt-3 mb-2">
        <span id="omikujiCategory" class="text-xs tracking-[0.35em] font-semibold text-[#b91c1c]/90 block">
          天字第一號・炭火總指揮官
        </span>
        <div class="text-xs tracking-[0.5em] font-medium text-[#b91c1c]/80 mt-0.5">
          【 運 勢 】
        </div>
      </div>

      <!-- 中間雙實線分割 -->
      <div class="w-full border-t border-[#b91c1c] mt-1"></div>
      <div class="w-full border-t border-[#b91c1c] mt-0.5 mb-4"></div>

      <!-- 核心吉凶大字 (日式明朝體 加大粗朱紅) -->
      <div class="my-2 text-center">
        <h2 id="omikujiRank" class="text-3xl font-black tracking-[0.2em] text-[#b91c1c] font-serif border-y-2 border-[#b91c1c] py-2 px-6 inline-block">
          上上籤・首獎
        </h2>
      </div>

      <!-- 中間雙實線分割 -->
      <div class="w-full border-t border-[#b91c1c] mt-4"></div>
      <div class="w-full border-t border-[#b91c1c] mt-0.5 mb-5"></div>

      <!-- 核心直排籤詩祝詞 ＋ 永久內嵌自訂吉祥物圖案 (Base64 永久固定，防外界竄改) -->
      <div class="w-full flex items-center justify-center min-h-[220px] px-3 relative my-2">
        
        <!-- 中央偏左：全直排日式明朝體籤詩 -->
        <div class="flex items-start justify-center gap-6 h-[210px] mr-12">
          <!-- 第二行 (左) -->
          <p id="poemLine2" class="vertical-text text-base font-bold text-[#b91c1c] tracking-widest leading-loose">
            眾人皆搶吐司片，唯你獨享五花肉。
          </p>
          <!-- 第一行 (右起) -->
          <p id="poemLine1" class="vertical-text text-base font-bold text-[#b91c1c] tracking-widest leading-loose border-l border-[#b91c1c]/25 pl-4">
            生肉熟食分得清，香腸金黃不帶黑；
          </p>
        </div>

        <!-- 
          =======================================================
          【右下角：永久固定專屬圖片位置（方法二 Base64）】
          請將下方 img 的 src 替換為你的 Base64 編碼文字（data:image/png;base64,...）
          =======================================================
        -->
        <div class="absolute bottom-0 right-1 z-10 w-24 h-24 flex items-end justify-center pointer-events-none select-none">
          <img 
            id="fixedMascotImg" 
            src="data:image/svg+xml;utf8,<svg viewBox='0 0 100 100' fill='none' xmlns='http://www.w3.org/2000/svg'><path d='M50 15 C30 15 18 30 18 50 C18 70 30 85 50 85 C70 85 82 70 82 50 C82 30 70 15 50 15 Z' fill='%23C27D38'/><circle cx='50' cy='18' r='7' fill='%23A86224'/><circle cx='28' cy='26' r='7' fill='%23A86224'/><circle cx='72' cy='26' r='7' fill='%23A86224'/><circle cx='18' cy='48' r='7' fill='%23A86224'/><circle cx='82' cy='48' r='7' fill='%23A86224'/><circle cx='28' cy='72' r='7' fill='%23A86224'/><circle cx='72' cy='72' r='7' fill='%23A86224'/><ellipse cx='50' cy='53' rx='27' ry='24' fill='%23E8A859'/><ellipse cx='50' cy='58' rx='20' ry='16' fill='%23FDE3B2'/><circle cx='34' cy='56' r='5' fill='%23EF6A5B' opacity='0.6'/><circle cx='66' cy='56' r='5' fill='%23EF6A5B' opacity='0.6'/><path d='M36 47 Q40 43 44 47' stroke='%233E2415' stroke-width='2.2' stroke-linecap='round'/><path d='M56 47 Q60 43 64 47' stroke='%233E2415' stroke-width='2.2' stroke-linecap='round'/><path d='M46 58 Q50 63 54 58' stroke='%233E2415' stroke-width='2' stroke-linecap='round'/><g transform='translate(68, 62) rotate(25)'><line x1='0' y1='0' x2='0' y2='28' stroke='%238D5B28' stroke-width='2' stroke-linecap='round'/><circle cx='0' cy='6' r='3.5' fill='%23B91C1C'/><circle cx='0' cy='13' r='3.5' fill='%2315803D'/><circle cx='0' cy='20' r='3.5' fill='%23B45309'/></g></svg>" 
            alt="專屬吉祥物" 
            class="w-full h-full object-contain drop-shadow-sm pointer-events-none"
          >
        </div>

      </div>

      <!-- 底部雙實線分割 -->
      <div class="w-full border-t border-[#b91c1c] mt-4"></div>
      <div class="w-full border-t-2 border-[#b91c1c] mt-0.5"></div>

      <!-- 底部紅白慶典水引繩結 (Mizuhiki Umemusubi 梅花結) -->
      <div class="w-full flex flex-col items-center my-3.5 relative">
        <svg class="w-48 h-10" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="0" y1="20" x2="80" y2="20" stroke="#b91c1c" stroke-width="1.2"/>
          <line x1="0" y1="24" x2="80" y2="24" stroke="#b91c1c" stroke-width="1.2"/>
          <line x1="120" y1="20" x2="200" y2="20" stroke="#b91c1c" stroke-width="1.2"/>
          <line x1="120" y1="24" x2="200" y2="24" stroke="#b91c1c" stroke-width="1.2"/>
          <g transform="translate(100, 21)" stroke="#b91c1c" stroke-width="1.5" fill="none">
            <circle cx="0" cy="-6" r="5"/>
            <circle cx="-6" cy="-1" r="5"/>
            <circle cx="6" cy="-1" r="5"/>
            <circle cx="-4" cy="6" r="5"/>
            <circle cx="4" cy="6" r="5"/>
            <circle cx="0" cy="0" r="2" fill="#b91c1c"/>
          </g>
        </svg>
      </div>

      <!-- 底部神社社號落款 -->
      <div class="w-full text-center pb-2">
        <span class="text-sm font-bold tracking-[0.25em] text-[#b91c1c] font-serif block">
          Kahoot! Fun Taiwan
        </span>
        <span class="text-[9px] text-[#b91c1c]/70 tracking-widest mt-0.5 block">
          太陰星君神璽・中秋大會限定
        </span>
      </div>

    </div>

    <!-- 底部社群行動操作列 -->
    <div class="w-[330px] flex flex-col gap-2.5 mt-5">
      <!-- 儲存籤紙圖片按鈕 -->
      <button 
        id="saveImgBtn"
        class="w-full bg-amber-500 hover:bg-amber-400 active:scale-[0.99] text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm"
      >
        <span>📸 下載/長按儲存這張籤紙</span>
      </button>

      <!-- 引導貼回 FB 領冷知識題組 -->
      <a 
        href="https://www.facebook.com" 
        target="_blank" 
        rel="noopener noreferrer"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl text-center shadow-md transition flex items-center justify-center gap-2 text-sm"
      >
        <span>💬 貼回 FB 貼文留言，兌換【完整解籤＋題組包】</span>
      </a>

      <button 
        id="redrawBtn"
        class="text-xs text-slate-400 hover:text-slate-200 text-center py-1 mt-1 underline"
      >
        🔄 再求一次籤
      </button>
    </div>

  </main>

  <!-- 核心運作邏輯 -->
  <script>
    const OMIKUJI_LIST = [
      {
        category: "天字第一號・炭火總指揮官",
        rank: "上上籤・首獎",
        line1: "生肉熟食分得清，香腸金黃不帶黑；",
        line2: "眾人皆搶吐司片，唯你獨享五花肉。"
      },
      {
        category: "特級柚惑・熱量免役大師",
        rank: "大吉・吃貨籤",
        line1: "蛋黃酥皮層層起，柚子甜美不用剝；",
        line2: "連假熱量歸月亮，長肉全算在吳剛。"
      },
      {
        category: "佛系看客・人間避雷針",
        rank: "中吉・安泰籤",
        line1: "木炭點火半小時，火星未起心先平；",
        line2: "雖然答錯三五題，至少沒被濃煙燻。"
      },
      {
        category: "吳剛化身・下班解脫者",
        rank: "末吉・放飛籤",
        line1: "砍樹萬年砍不倒，作答全憑直覺衝；",
        line2: "分數高低皆浮雲，連假放飛萬事通。"
      }
    ];

    const drawBox = document.getElementById('drawBox');
    const drawBtn = document.getElementById('drawBtn');
    const cylinder = document.getElementById('cylinder');
    const omikujiWrapper = document.getElementById('omikujiWrapper');
    const omikujiPaper = document.getElementById('omikujiPaper');
    const redrawBtn = document.getElementById('redrawBtn');
    const saveImgBtn = document.getElementById('saveImgBtn');

    // 籤紙欄位
    const omikujiCategory = document.getElementById('omikujiCategory');
    const omikujiRank = document.getElementById('omikujiRank');
    const poemLine1 = document.getElementById('poemLine1');
    const poemLine2 = document.getElementById('poemLine2');

    // 搖籤動作
    function performDraw() {
      drawBtn.disabled = true;
      drawBtn.innerText = "🎋 誠心祈念中...";
      cylinder.classList.add('animate-shake');

      setTimeout(() => {
        cylinder.classList.remove('animate-shake');
        const luckyOne = OMIKUJI_LIST[Math.floor(Math.random() * OMIKUJI_LIST.length)];
        
        omikujiCategory.textContent = luckyOne.category;
        omikujiRank.textContent = luckyOne.rank;
        poemLine1.textContent = luckyOne.line1;
        poemLine2.textContent = luckyOne.line2;

        drawBox.classList.add('hidden');
        omikujiWrapper.classList.remove('hidden');
        omikujiWrapper.scrollIntoView({ behavior: 'smooth' });

        drawBtn.disabled = false;
        drawBtn.innerText = "🎋 搖一搖・求取神籤";
      }, 650);
    }

    drawBtn.addEventListener('click', performDraw);
    cylinder.addEventListener('click', performDraw);

    redrawBtn.addEventListener('click', () => {
      omikujiWrapper.classList.add('hidden');
      drawBox.classList.remove('hidden');
      drawBox.scrollIntoView({ behavior: 'smooth' });
    });

    // 匯出生成高畫質長條圖卡 (html2canvas)
    saveImgBtn.addEventListener('click', () => {
      saveImgBtn.innerText = "⏳ 正在生成籤紙圖檔...";
      saveImgBtn.disabled = true;

      html2canvas(omikujiPaper, {
        scale: 3,
        useCORS: true,
        backgroundColor: null
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `中秋御神籤-${omikujiRank.textContent.trim()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        saveImgBtn.innerText = "✅ 籤紙已儲存！請至相簿查看";
        setTimeout(() => {
          saveImgBtn.innerText = "📸 下載/長按儲存這張籤紙";
          saveImgBtn.disabled = false;
        }, 2500);
      }).catch(err => {
        console.error(err);
        alert("也可以直接使用手機螢幕截圖儲存這張籤紙喔！");
        saveImgBtn.innerText = "📸 下載/長按儲存這張籤紙";
        saveImgBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
